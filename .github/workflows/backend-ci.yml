name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: actiflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d actiflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENV: test
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/actiflow_placeholder
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/actiflow_test
      JWT_SECRET: ci-only-secret-with-at-least-32-characters

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify single migration head
        run: test "$(alembic heads | grep -c '(head)')" -eq 1

      - name: Upgrade an empty database
        run: alembic upgrade head

      - name: Verify ORM and migration metadata agree
        run: alembic check

      - name: Run tests
        run: pytest -q

      - name: Check patch whitespace
        run: git diff --check
